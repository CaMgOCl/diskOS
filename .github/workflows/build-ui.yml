name: build-ui (zh-115)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # The UI carries a helper linked against the STOCK V2.57 libraries, so the build needs
      # (a) the extracted stock rootfs and (b) the public FFmpeg 4.2.2 headers.
      # Both are produced here from public sources and hash-checked.
      - name: Prepare stock fixture and FFmpeg headers
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

          mkdir -p scratch vendor-src/ffmpeg

          echo "== official firmware (public) =="
          curl -sSL --retry 3 -o scratch/fw.zip \
            https://fiio-firmware.fiio.net/DISC/SNOWSKY_DISC_update_20260909_v257.zip
          echo "2bfad000609440bcbf492468e9e5f8f3d5e0bade797323431a15b5755688bfcf  scratch/fw.zip" | sha256sum -c -

          echo "== decrypt + assemble the stock rootfs (the repo's own extractor) =="
          python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from diskos_installer.imagebuild import extract_stock_rootfs
          extract_stock_rootfs('scratch/fw.zip', 'scratch/stock.squashfs', 'scratch/work')
          PY

          echo "== unpack the stock rootfs as the helper's sysroot =="
          mkdir -p scratch/fixtures
          unsquashfs -no-xattrs -d scratch/fixtures/v257 scratch/stock.squashfs
          ls -l scratch/fixtures/v257/lib/ld-linux-mipsn8.so.1
          ls -l scratch/fixtures/v257/lib/libc.so.6
          ls -l scratch/fixtures/v257/usr/lib/libavformat.so.58
          ls -l scratch/fixtures/v257/usr/lib/libavcodec.so.58
          ls -l scratch/fixtures/v257/usr/lib/libavutil.so.56

          echo "== public FFmpeg headers (only headers are used) =="
          curl -sSL --retry 3 -o vendor-src/ffmpeg/ffmpeg-4.2.2.tar.xz \
            https://ffmpeg.org/releases/ffmpeg-4.2.2.tar.xz
          echo "cb754255ab0ee2ea5f66f8850e1bd6ad5cac1cd855d0a2f4990fb8c668b0d29c  vendor-src/ffmpeg/ffmpeg-4.2.2.tar.xz" | sha256sum -c -

      # The pinned toolchain image is expensive to build (~25 min). Cache it so later
      # iterations only re-run the UI build.
      - name: Restore cached toolchain image
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: toolchain-image.tar.gz
          key: toolchain-v1-${{ hashFiles('ui/Dockerfile', 'ui/toolchain/mcm-config.mak', 'ui/toolchain/mcm-cxx.mak') }}

      - name: Build mq_ui with the pinned musl-cross-make toolchain
        run: |
          set -eu
          if [ -f toolchain-image.tar.gz ]; then
            echo "=== restoring cached toolchain image ==="
            gunzip -c toolchain-image.tar.gz | docker load
          else
            # The toolchain build downloads gcc/binutils/gmp/mpc/mpfr; a mirror can be flaky,
            # so retry the image build.
            for attempt in 1 2 3; do
              echo "=== toolchain image build attempt $attempt ==="
              if docker build --progress=plain -t diskos-ui-builder ui; then break; fi
              echo "=== attempt $attempt failed; retrying in 30s ==="
              sleep 30
            done
            docker image inspect diskos-ui-builder >/dev/null
            docker save diskos-ui-builder | gzip > toolchain-image.tar.gz
            ls -l toolchain-image.tar.gz
          fi

          echo "=== building the UI ==="
          for attempt in 1 2 3; do
            echo "=== ui build attempt $attempt ==="
            if docker run --rm -u "$(id -u):$(id -g)" \
                 -v "$PWD/ui:/src" \
                 -v "$PWD/tools:/tools" \
                 -v "$PWD/scratch:/scratch" \
                 -v "$PWD/vendor-src:/vendor-src" \
                 diskos-ui-builder \
                 sh -c 'make CROSS=$CROSS HB_CROSS=$HB_CROSS \
                          STOCK_AV_HEADERS=/vendor-src/ffmpeg/ffmpeg-4.2.2.tar.xz \
                          STOCK_SYSROOT=/scratch/fixtures/v257 \
                        && ls -l mq_ui'; then
              file ui/mq_ui
              ls -l ui/mq_ui
              exit 0
            fi
            echo "=== attempt $attempt failed; retrying in 30s ==="
            sleep 30
          done
          echo "ui build failed after 3 attempts"
          exit 1

      - name: Upload the built UI binary
        uses: actions/upload-artifact@v4
        with:
          name: mq_ui-zh115
          path: |
            ui/mq_ui
          if-no-files-found: error
